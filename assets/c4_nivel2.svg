  </style>
</defs>

<!-- Fundo -->
<rect width="1100" height="800" fill="#07101c"/>

<!-- Título -->
<text x="550" y="32" text-anchor="middle" class="titulo">C4 Nível 2 — Contêineres do Faro e do OPNsense</text>
<text x="550" y="50" text-anchor="middle" class="sub">O pacote chega uma vez pela igb0: Suricata recebe cópia, PF processa o original. Community ID une os dois.</text>
<line x1="20" y1="60" x2="1080" y2="60" stroke="#1e3050" stroke-width="1"/>

<!-- ═══════════════════════════════════════════
     CONTAINER: OPNsense (esquerda)
════════════════════════════════════════════ -->
<rect x="20" y="75" width="390" height="430" rx="12" fill="none" stroke="#8ba3c0" stroke-width="1.5" stroke-dasharray="8,5"/>
<text x="215" y="97" text-anchor="middle" class="cnt">OPNsense [firewall existente]</text>

<!-- igb0 WAN -->
