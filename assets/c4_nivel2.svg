<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
<defs>
  <marker id="a" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,9 3.5,0 7" fill="#4f91ff"/>
  </marker>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .titulo { font-size:17px; font-weight:700; fill:#4f91ff; }
    .sub    { font-size:11px; fill:#8ba3c0; }
    .label  { font-size:12px; font-weight:700; fill:#e8f0fe; }
    .desc   { font-size:9px;  fill:#8ba3c0; }
    .tipo   { font-size:8px;  fill:#8ba3c0; }
    .seta   { font-size:9px;  fill:#8ba3c0; }
